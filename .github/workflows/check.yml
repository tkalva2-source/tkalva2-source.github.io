name: Check 7TV unlocks

on:
  schedule:
    - cron: "*/15 * * * *" # GitHub may run scheduled jobs late at busy times
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paintwatch-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The ownership index is too big for git; keep it in the Actions cache between runs (it rebuilds itself if evicted).
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: paintwatch-index-${{ github.run_id }}
          restore-keys: paintwatch-index-
      - run: node tracker/check.mjs
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: cache
          key: paintwatch-index-${{ github.run_id }}
      - name: Save results
        run: |
          git config user.name "paintwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update 7TV data" && git push)
